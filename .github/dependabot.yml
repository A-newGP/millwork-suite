# Keeps the pinned GitHub Actions up to date. Language ecosystems are added
# together with the technical stack.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
