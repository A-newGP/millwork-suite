# Prepares a release when a version tag such as v0.1.0-beta.1 is pushed:
# builds and tests the Windows installer, packs the sample kitchen, and
# creates a *draft* GitHub release with them, their SHA-256 checksums and
# the version's notes from CHANGELOG.md. A maintainer reviews the draft
# and publishes it by hand (see docs/releasing.md).

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tag must be a SemVer version, match Cargo.toml and have notes.
      - id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "not a version tag: $GITHUB_REF_NAME"; exit 1
          fi
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          [ "$version" = "$cargo" ] || { echo "tag $version, Cargo.toml $cargo"; exit 1; }
          grep -qF "## [$version]" CHANGELOG.md || { echo "no notes for $version in CHANGELOG.md"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  installer:
    name: Installer
    needs: version
    uses: ./.github/workflows/windows-installer.yml
    with:
      version: ${{ needs.version.outputs.version }}

  sample:
    name: Sample project
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Pack the sample kitchen
        run: cargo run --locked -q -p opencabinet-format --example pack -- fixtures/kitchen.ocab sample-kitchen.ocab
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sample-kitchen
          path: sample-kitchen.ocab
          retention-days: 7

  draft:
    name: Draft release
    needs: [version, installer, sample]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # To create the draft release.
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: assets
          merge-multiple: true
      - name: Checksums and notes
        run: |
          cd assets
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..
          # The version's section of CHANGELOG.md, without its heading or the
          # link definitions at the end of the file.
          awk -v v="## [$VERSION]" '
            index($0, v) == 1 { on = 1; next }
            /^## \[/ { on = 0 }
            /^\[[^]]*\]: / { next }
            on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "empty notes"; exit 1; }
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft $prerelease \
            --verify-tag \
            --title "OpenCabinet Designer $VERSION" \
            --notes-file notes.md
