# Checks the application crates: formatting, lints, tests on Linux and
# Windows, and the licenses and sources of every dependency.

name: Rust

on:
  pull_request:
    paths:
      - crates/**
      - fixtures/**
      - assets/**
      - Cargo.toml
      - Cargo.lock
      - clippy.toml
      - deny.toml
      - rust-toolchain.toml
      - .github/workflows/rust.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  # Every warning is an error in CI.
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup reads rust-toolchain.toml and installs the pinned version.
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      # The libraries Slint links against on Linux: fonts, keyboard layouts,
      # Wayland and X11, and OpenGL.
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends             libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libgl1-mesa-dri
      - name: Fetch dependencies
        run: cargo fetch --locked
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets
      - name: Test
        run: cargo test --locked --workspace
      - name: Documentation
        run: cargo doc --locked --workspace --no-deps
      # The cut list PDF, read back by independent open source readers.
      - name: Check the PDF with independent readers
        if: runner.os == 'Linux'
        run: |
          cargo run --locked -q -p opencabinet-reports --example cut_list_pdf -- cut-list.pdf
          sudo apt-get install -y --no-install-recommends qpdf poppler-utils
          qpdf --check cut-list.pdf
          text=$(pdftotext cut-list.pdf -)
          for expected in "Cut list" "Left side" "Door 2" "28-19/32" "4 edges"; do
            grep -qF "$expected" <<< "$text" || { echo "missing: $expected"; exit 1; }
          done
          pdffonts cut-list.pdf

  dependencies:
    name: Dependencies (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DENY_VERSION: 0.20.2
      DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A released binary, verified against its published checksum.
      - name: Install cargo-deny
        run: |
          name="cargo-deny-$DENY_VERSION-x86_64-unknown-linux-musl"
          curl -sSfL -o deny.tar.gz \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$DENY_VERSION/$name.tar.gz"
          echo "$DENY_SHA256  deny.tar.gz" | sha256sum --check
          tar -xzf deny.tar.gz
          mv "$name/cargo-deny" "$HOME/.cargo/bin/"
      - name: Check licenses, sources and advisories
        run: cargo deny --locked check
