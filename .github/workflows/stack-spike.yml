# Builds, verifies and measures the throwaway stack prototypes on equal terms.
# Removed together with prototypes/stack-spike once the stack ADR is accepted.

name: Stack spike

on:
  pull_request:
    paths:
      - prototypes/stack-spike/**
      - .github/workflows/stack-spike.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: prototypes/stack-spike

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - name: Fetch dependencies
        working-directory: prototypes/stack-spike/rust
        run: cargo fetch --locked
      - name: Format and lint
        working-directory: prototypes/stack-spike/rust
        run: cargo fmt --check && cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        working-directory: prototypes/stack-spike/rust
        run: cargo test --locked
      - name: Release build
        working-directory: prototypes/stack-spike/rust
        run: |
          start=$(date +%s)
          cargo build --locked --release
          echo "BUILD_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
      - name: Verify and measure
        run: |
          exe=rust/target/release/oc-spike
          [[ "$RUNNER_OS" == Windows ]] && exe="$exe.exe"
          ./measure.sh Rust "$exe" "$BUILD_SECONDS"

  csharp:
    name: C# (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        working-directory: prototypes/stack-spike/csharp
        run: dotnet restore OcSpike.slnx && dotnet restore OcSpike/OcSpike.csproj -r ${{ matrix.rid }}
      - name: Format check
        working-directory: prototypes/stack-spike/csharp
        run: dotnet format OcSpike.slnx --verify-no-changes --no-restore
      - name: Test
        working-directory: prototypes/stack-spike/csharp
        run: dotnet test OcSpike.slnx --no-restore
      - name: Native AOT release build
        working-directory: prototypes/stack-spike/csharp
        run: |
          start=$(date +%s)
          dotnet publish OcSpike/OcSpike.csproj -c Release -r ${{ matrix.rid }} --no-restore -o publish
          echo "BUILD_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
      - name: Verify and measure
        run: |
          exe=csharp/publish/oc-spike
          [[ "$RUNNER_OS" == Windows ]] && exe="$exe.exe"
          ./measure.sh "C# (Native AOT)" "$exe" "$BUILD_SECONDS"
