# Builds, tests and measures the throwaway UI prototypes on equal terms.
# Removed together with prototypes/ui-spike once the UI ADR is accepted.

name: UI spike

on:
  pull_request:
    paths:
      - prototypes/ui-spike/**
      - .github/workflows/ui-spike.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: prototypes/ui-spike

env:
  CARGO_TERM_COLOR: always
  # WebKitGTK under a virtual display: avoid GPU paths the runner lacks.
  WEBKIT_DISABLE_DMABUF_RENDERER: "1"

jobs:
  lint:
    name: Format, lint and core tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system libraries
        run: ./ci-linux-deps.sh
      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked -p oc-ui-core

  measure:
    name: ${{ matrix.app }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        app: [slint, egui, tauri]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: ./ci-linux-deps.sh
      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Fetch dependencies
        run: cargo fetch --locked
      - name: Test
        run: cargo test --locked -p oc-ui-${{ matrix.app }}
      - name: Release build (cold, this front end only)
        env:
          CARGO_TARGET_DIR: target-release
        run: |
          start=$(date +%s)
          cargo build --locked --release -p oc-ui-${{ matrix.app }}
          echo "BUILD_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
      - name: Measure
        run: |
          exe=target-release/release/oc-ui-${{ matrix.app }}
          if [[ "$RUNNER_OS" == Windows ]]; then
            ./measure-ui.sh "${{ matrix.app }}" "$exe.exe" "$BUILD_SECONDS"
          else
            xvfb-run -a -s "-screen 0 1920x1080x24" ./measure-ui.sh "${{ matrix.app }}" "$exe" "$BUILD_SECONDS"
          fi
