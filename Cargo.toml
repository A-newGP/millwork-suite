[workspace]
resolver = "3"
members = ["crates/*"]
# Each prototype is its own throwaway workspace.
exclude = ["prototypes"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/OpenCabinet/opencabinet"
publish = false

[workspace.dependencies]
opencabinet-eval = { path = "crates/opencabinet-eval" }
opencabinet-format = { path = "crates/opencabinet-format" }
opencabinet-model = { path = "crates/opencabinet-model" }
opencabinet-reports = { path = "crates/opencabinet-reports" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.0", features = ["serde", "v7"] }
zip = { version = "9.1.0", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
# "deny", not "forbid": code generated by Slint allows itself unsafe code.
# Ours never does without an explicit, reviewed `allow`.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Small, fast release builds for modest computers (ADR-0014).
[profile.release]
lto = true
codegen-units = 1
strip = true
