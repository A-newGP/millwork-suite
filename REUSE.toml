# SPDX-FileCopyrightText: 2026 OpenCabinet contributors
# SPDX-License-Identifier: CC0-1.0

# Licensing for files that cannot carry an SPDX header, or where a header
# would be shown to users. See https://reuse.software/spec-3.3/#reusetoml
version = 1

[[annotations]]
path = ".github/PULL_REQUEST_TEMPLATE.md"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 OpenCabinet contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Generated by Cargo, which does not allow a license header.
[[annotations]]
path = "Cargo.lock"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 OpenCabinet contributors"
SPDX-License-Identifier = "CC0-1.0"

# Hand-written test projects; JSON cannot carry a license header.
[[annotations]]
path = "fixtures/**"
# The README there has its own header, which wins.
precedence = "closest"
SPDX-FileCopyrightText = "2026 OpenCabinet contributors"
SPDX-License-Identifier = "CC0-1.0"
