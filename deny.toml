# cargo-deny checks every third-party crate before it enters the program:
# its license must be compatible with GPL-3.0-or-later (plan, section A),
# it must come from crates.io, and it must have no known vulnerability.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Unmaintained crates are reported, not fatal: a replacement needs a plan.
unmaintained = "workspace"
yanked = "deny"

[licenses]
# Every license here is compatible with GPL-3.0-or-later. Adding one needs
# a pull request that explains why it is compatible.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9
# OpenCabinet's own crates are GPL-3.0-or-later and never published.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
