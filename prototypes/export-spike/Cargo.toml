[workspace]
resolver = "3"
members = ["core", "plain", "dxf", "krilla", "printpdf"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
oc-export-core = { path = "core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Same release settings for every exporter, so sizes are comparable.
[profile.release]
lto = true
codegen-units = 1
strip = true
