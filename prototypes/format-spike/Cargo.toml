[package]
name = "oc-format"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Throwaway format spike: save and reopen an .ocab project as RFC-0001 describes it"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.0", features = ["serde"] }
zip = { version = "9.1.0", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
