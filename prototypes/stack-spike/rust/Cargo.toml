[package]
name = "oc-spike"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Throwaway stack spike: evaluate an .ocab project into a cut list"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zip = { version = "9.1.0", default-features = false, features = ["deflate"] }

# Optimize for the measurements: smallest, fastest single binary.
[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
