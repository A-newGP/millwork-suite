[package]
name = "oc-ui-tauri"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
oc-ui-core = { workspace = true }
serde = { workspace = true }
# `custom-protocol` embeds the web assets in the binary, as `tauri build`
# does for production; without it Tauri expects a development server.
tauri = { version = "2.12.5", features = ["custom-protocol"] }

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
