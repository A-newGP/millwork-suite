<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>OpenCabinet UI spike — Tauri</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <aside>
      <h1>Base cabinet</h1>
      <label>Width (in) <input id="width"></label>
      <label>Height (in) <input id="height"></label>
      <label>Depth (in) <input id="depth"></label>
      <label>Doors <input id="doors" type="number" min="1" max="2"></label>
      <p id="error" role="alert"></p>
    </aside>
    <main>
      <svg id="drawing" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="table">
        <table>
          <thead>
            <tr><th>Part</th><th>Material</th><th>Qty</th><th>Length</th><th>Width</th><th>Thickness</th></tr>
          </thead>
          <tbody id="cut-list"></tbody>
        </table>
      </div>
    </main>
  </body>
</html>
